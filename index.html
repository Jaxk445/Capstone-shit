<!doctype html>
<html lang="en">
  <head>
    <!-- Content Security Policy is delivered via HTTP header (configured in vercel.json) -->
    
    <!-- X-Frame-Options: Prevent clickjacking -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Referrer Policy: Don't leak referer info -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Permissions Policy: Disable unnecessary features -->
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(self)">
    
    <!-- Additional -->
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/LOGO ahh.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom and Excise Employee Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
